version: "3.8"

networks:
  media_center_net:
    name: media_center_net
    driver: bridge

services:
  plex:
    container_name: media_center_plex
    hostname: ${PLEX_HOSTNAME:-podmedia}
    image: lscr.io/linuxserver/plex:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=latest
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP:-http://localhost:32400}
    volumes:
      - ./config:/config:Z
      - ${MEDIA_DIR:-../../media}:/media:Z
    ports:
      - "32400:32400"
    networks:
      - media_center_net
    restart: unless-stopped
