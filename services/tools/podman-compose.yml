version: "3.8"

networks:
  media_center_net:
    name: media_center_net
    driver: bridge

services:
  radarr:
    container_name: media_center_radarr
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./radarr/config:/config:Z
      - ${MEDIA_DIR:-../../media}/movies:/movies:Z
      - type: bind
        source: ${EXTERNAL_MOVIES_DIR:-../../media_external_stub/movies}
        target: /movies_external
      - ${DOWNLOADS_DIR:-../../downloads}:/downloads:Z
    ports:
      - "7878:7878"
    networks:
      - media_center_net
    restart: unless-stopped

  sonarr:
    container_name: media_center_sonarr
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./sonarr/config:/config:Z
      - ${MEDIA_DIR:-../../media}/series:/series:Z
      - ${MEDIA_DIR:-../../media}/series:/tv:Z
      - type: bind
        source: ${EXTERNAL_SERIES_DIR:-../../media_external_stub/series}
        target: /series_external
      - type: bind
        source: ${EXTERNAL_SERIES_DIR:-../../media_external_stub/series}
        target: /tv_external
      - ${DOWNLOADS_DIR:-../../downloads}:/downloads:Z
    ports:
      - "8989:8989"
    networks:
      - media_center_net
    restart: unless-stopped

  prowlarr:
    container_name: media_center_prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./prowlarr/config:/config:Z
    ports:
      - "9696:9696"
    depends_on:
      - flaresolverr
    networks:
      - media_center_net
    restart: unless-stopped

  qbittorrent:
    container_name: media_center_qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config:Z
      - ${DOWNLOADS_DIR:-../../downloads}:/downloads:Z
    ports:
      - "8080:8080"
    networks:
      - media_center_net
    restart: unless-stopped

  flaresolverr:
    container_name: media_center_flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    networks:
      - media_center_net
    restart: unless-stopped

  slskd:
    container_name: media_center_slskd
    image: ghcr.io/slskd/slskd:latest
    environment:
      - PUID=1000
      - PGID=1000
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_CONFIG=/app/slskd.yml
      - SLSKD_WEB__AUTHENTICATION__ENABLED=false
      - SLSKD_NO_AUTH=true
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./slskd/config/slskd.yml:/app/slskd.yml:Z
      - ./slskd/config:/app/data:Z
      - ${MEDIA_DIR:-../../media}/music:/music:Z
      - ${DOWNLOADS_DIR:-../../downloads}:/downloads:Z
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    networks:
      - media_center_net
    restart: unless-stopped

  beets:
    container_name: media_center_beets
    image: lscr.io/linuxserver/beets:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./beets/config:/config:Z
      - ${MEDIA_DIR:-../../media}/music:/music:Z
      - ${DOWNLOADS_DIR:-../../downloads}:/downloads:Z
    networks:
      - media_center_net
    restart: unless-stopped

  metube:
    container_name: media_center_metube
    image: ghcr.io/alexta69/metube:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Istanbul}
      - DOWNLOAD_DIR=/downloads
      - AUDIO_ONLY=true
      - YTDL_AUTO_UPDATE=true
      - COOKIES_FILE=/app/cookies/cookies.txt
      - OUTPUT_TEMPLATE=%(artist,uploader)s - %(title)s.%(ext)s
    volumes:
      - ${DOWNLOADS_DIR:-../../downloads}/music/complete:/downloads:Z
      - ./metube:/app/cookies:Z
    ports:
      - "8081:8081"
    networks:
      - media_center_net
    restart: unless-stopped

