version: "3.8"

networks:
  media_center_net:
    name: media_center_net
    driver: bridge

services:
  homepage:
    container_name: media_center_homepage
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
    volumes:
      - ./config:/app/config:Z
    ports:
      - "3000:3000"
    networks:
      - media_center_net
    restart: unless-stopped
